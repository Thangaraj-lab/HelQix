name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust build and test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml selects the stable channel; rustup on the runner installs it.
      - name: Toolchain version
        run: rustc --version && cargo --version
      - name: Build workspace
        run: cargo build --workspace --locked
      - name: Test workspace
        run: cargo test --workspace --locked --no-fail-fast

  python:
    name: Python suites (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install pytest "pydantic>=2,<3"
      - name: 19-intelligence
        working-directory: 19-intelligence/python
        run: python -m pytest -q tests
      - name: 15-sdk (Python)
        working-directory: 15-sdk/platform/sdk/python
        run: python -m pytest -q tests
      - name: 18-libraries
        working-directory: 18-libraries/python
        run: python -m pytest -q tests
