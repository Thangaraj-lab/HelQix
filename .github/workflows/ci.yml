name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust build and test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml selects the stable channel; rustup on the runner installs it.
      - name: Toolchain version
        run: rustc --version && cargo --version
      - name: Build workspace
        run: cargo build --workspace --locked
      - name: Test workspace
        run: cargo test --workspace --locked --no-fail-fast
      - name: Run-twice replay check (Phase 2)
        run: cargo run --locked -p helqix-freeze --bin helqix-replay-check
      - name: Agent permissions demo (Phase 7B; CI approval is not a human review)
        run: cargo run -q -p helqix-agent --locked --bin helqix-agent-demo -- --approve-as ci-non-human
      - name: Branch intervention demo (Phase 4)
        run: cargo run --locked -p helqix-branch --bin helqix-branch-demo
      - name: Evidence verifier has no HELQIX runtime dependency (Phase 5)
        run: |
          deps=$(cargo tree --locked -p helqix-evidence-verify -e normal --prefix none | awk '{print $1}' | grep '^helqix' | grep -v '^helqix-evidence-verify$' || true)
          if [ -n "$deps" ]; then echo "verifier depends on: $deps"; exit 1; fi
          echo "verifier is independent of the HELQIX runtime"
      - name: Verify the Windows-built sample evidence package on Linux (Phase 5)
        run: cargo run --locked -p helqix-evidence-verify --bin helqix-evidence-verify -- docs/evidence/sample-package --trusted-key-file docs/evidence/sample-package.public-key.txt
      - name: Re-execute the sample package on Linux (cross-platform bitwise check)
        run: cargo run --locked -p helqix-evidence-pack --bin helqix-evidence-pack -- reexecute docs/evidence/sample-package

  licence-gates:
    name: Licence gates (K1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-deny 0.20.2
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: cargo-deny (licences, bans, sources, advisories)
        run: cargo deny --locked check
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: JS licence gate (reality-studio)
        run: bash scripts/js-license-check.sh 21-app/reality-studio
      - name: Tool register gate
        run: python3 -I scripts/check_tools_lock.py tools/TOOLS.lock.json

  api:
    name: Contracts and staged-build API (K2)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-trixie
        env:
          POSTGRES_USER: helqix
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: helqix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U helqix" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      HELQIX_TEST_DATABASE_URL: postgres://helqix:ci-only-password@127.0.0.1:5432/helqix
    steps:
      - uses: actions/checkout@v4
      - name: Contract tests (serde fixtures, schema files up to date)
        run: cargo test --locked -p helqix-contracts --features schema
      - name: Contract fixtures against JSON Schema (Python)
        run: |
          python3 -m pip install pytest "jsonschema==4.26.0"
          python3 -m pytest -q 15-sdk/platform/contracts/tests_py
      - name: Model-build engine tests
        run: cargo test --locked -p helqix-modelbuild
      - name: API acceptance test against PostgreSQL (must not be skipped)
        run: |
          cargo test --locked -p helqix-api --test builds_api -- --nocapture 2>&1 | tee api-test.log
          ! grep -q SKIPPED api-test.log
      - name: Start the API and run the curl demonstration
        env:
          DATABASE_URL: postgres://helqix:ci-only-password@127.0.0.1:5432/helqix
          HELQIX_API_KEY: ci-only-api-key-0123456789abcdef0123456789
          HELQIX_ALLOWED_ORIGINS: http://localhost:5173
        run: |
          cargo build --locked -p helqix-api --bin helqix-api
          ./target/debug/helqix-api > api.log 2>&1 &
          ready=no
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8080/health/ready && { ready=yes; break; }; sleep 1; done
          if [ "$ready" != yes ]; then bash scripts/ci_annotate.sh "API never became ready" api.log 40; exit 1; fi
          bash scripts/k2_curl_demo.sh http://127.0.0.1:8080 > demo.log 2>&1 || {
            bash scripts/ci_annotate.sh "curl demo failed" demo.log 40
            bash scripts/ci_annotate.sh "API log" api.log 25
            exit 1
          }
          cat demo.log

  fmi-adapter:
    name: FMI adapter benchmark (K3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FMPy and Pint (pinned)
        run: python -m pip install "fmpy==0.3.32" "pint==0.26.2"
      - name: Fetch Reference FMUs v0.0.42 (SHA-256 pinned, BSD-2-Clause, Example data)
        run: python -I tools/fixtures/fetch_reference_fmus.py .
      - name: FMI adapter tests (benchmark, units, timeout, invalid input, conformance)
        run: HELQIX_PYTHON="$(which python)" cargo test --locked -p helqix-adapters --features fmi-tests --test fmi

  dev-stack:
    name: Dev stack comes up (K1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL+pgvector, NATS, SeaweedFS, Temporal, OTel collector
        run: |
          cp deploy/dev/.env.example deploy/dev/.env
          dc="docker compose -f deploy/dev/compose.yaml --env-file deploy/dev/.env"
          if ! $dc up -d --wait --wait-timeout 180 > up.log 2>&1; then
            $dc ps -a > ps.log 2>&1; $dc logs --no-color --tail 12 > logs.log 2>&1
            bash scripts/ci_annotate.sh "compose up" up.log 25
            bash scripts/ci_annotate.sh "compose ps" ps.log 15
            bash scripts/ci_annotate.sh "compose logs" logs.log 60
            exit 1
          fi
          $dc ps
      - name: Probe each service
        run: |
          docker compose -f deploy/dev/compose.yaml --env-file deploy/dev/.env exec -T postgres psql -U helqix -d helqix -c "CREATE EXTENSION IF NOT EXISTS vector; SELECT extversion FROM pg_extension WHERE extname='vector';"
          curl -sf http://127.0.0.1:8222/healthz
          for i in $(seq 1 30); do curl -s -o /dev/null -w "%{http_code}\n" http://127.0.0.1:8333/ | grep -qE "200|403" && break; sleep 2; done
          curl -s -o /dev/null -w "seaweedfs s3 HTTP %{http_code}\n" http://127.0.0.1:8333/
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8233/ && break; sleep 2; done
          curl -sf -o /dev/null -w "temporal ui HTTP %{http_code}\n" http://127.0.0.1:8233/
          curl -s -o /dev/null -w "otlp http HTTP %{http_code}\n" -X POST -H "Content-Type: application/json" -d '{}' http://127.0.0.1:4318/v1/traces
      - name: Stop
        if: always()
        run: docker compose -f deploy/dev/compose.yaml --env-file deploy/dev/.env down -v

  python:
    name: Python suites (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install pytest "pydantic>=2,<3"
      - name: 19-intelligence
        working-directory: 19-intelligence/python
        run: python -m pytest -q tests
      - name: 15-sdk (Python)
        working-directory: 15-sdk/platform/sdk/python
        run: python -m pytest -q tests
      - name: 18-libraries
        working-directory: 18-libraries/python
        run: python -m pytest -q tests

  battery-pybamm:
    name: Battery domain pack and benchmarks (PyBaMM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyBaMM and test dependencies
        run: python -m pip install pytest "pybamm>=26.6,<27"
      - name: PyBaMM version
        run: python -c "import pybamm; print(pybamm.__version__)"
      - name: Battery model, calibration, integrity, pipeline (synthetic data, no network)
        working-directory: 18-libraries/python
        run: python -m pytest -q tests_pybamm
      - name: SPM benchmarks (closed form, convergence, determinism)
        run: python -m pytest -q 23-validation/benchmarks/battery
      - name: PyBaMM solver adapter tests (Phase 6)
        run: HELQIX_PYTHON="$(which python)" cargo test -p helqix-adapters --locked --features pybamm-tests --test pybamm
      - name: Verify the PyBaMM adapter evidence package on Linux (Phase 6)
        run: cargo run -q -p helqix-evidence-verify --locked -- docs/evidence/pybamm-adapter-package --trusted-key-file docs/evidence/sample-package.public-key.txt
