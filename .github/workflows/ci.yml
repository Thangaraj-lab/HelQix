name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust build and test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml selects the stable channel; rustup on the runner installs it.
      - name: Toolchain version
        run: rustc --version && cargo --version
      - name: Build workspace
        run: cargo build --workspace --locked
      - name: Test workspace
        run: cargo test --workspace --locked --no-fail-fast
      - name: Run-twice replay check (Phase 2)
        run: cargo run --locked -p helqix-freeze --bin helqix-replay-check
      - name: Agent permissions demo (Phase 7B; CI approval is not a human review)
        run: cargo run -q -p helqix-agent --locked --bin helqix-agent-demo -- --approve-as ci-non-human
      - name: Branch intervention demo (Phase 4)
        run: cargo run --locked -p helqix-branch --bin helqix-branch-demo
      - name: Evidence verifier has no HELQIX runtime dependency (Phase 5)
        run: |
          deps=$(cargo tree --locked -p helqix-evidence-verify -e normal --prefix none | awk '{print $1}' | grep '^helqix' | grep -v '^helqix-evidence-verify$' || true)
          if [ -n "$deps" ]; then echo "verifier depends on: $deps"; exit 1; fi
          echo "verifier is independent of the HELQIX runtime"
      - name: Verify the Windows-built sample evidence package on Linux (Phase 5)
        run: cargo run --locked -p helqix-evidence-verify --bin helqix-evidence-verify -- docs/evidence/sample-package --trusted-key-file docs/evidence/sample-package.public-key.txt
      - name: Re-execute the sample package on Linux (cross-platform bitwise check)
        run: cargo run --locked -p helqix-evidence-pack --bin helqix-evidence-pack -- reexecute docs/evidence/sample-package

  licence-gates:
    name: Licence gates (K1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-deny 0.20.2
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: cargo-deny (licences, bans, sources, advisories)
        run: cargo deny --locked check
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: JS licence gate (reality-studio)
        run: bash scripts/js-license-check.sh 21-app/reality-studio
      - name: Tool register gate
        run: python3 -I scripts/check_tools_lock.py tools/TOOLS.lock.json
      - name: Secret scan (tracked files)
        run: python3 -I scripts/secret_scan.py .

  container:
    name: Container image (E13)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-trixie
        env:
          POSTGRES_USER: helqix
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: helqix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U helqix" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -f deploy/Dockerfile.api -t helqix-api:ci .
      - name: The image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id helqix-api:ci -u)" != "0"
      - name: Start it against PostgreSQL and probe it
        run: |
          docker run -d --name api --network host             -e DATABASE_URL=postgres://helqix:ci-only-password@127.0.0.1:5432/helqix             -e HELQIX_API_KEY=ci-container-key-not-a-secret-0123456789             -e HELQIX_ALLOWED_ORIGINS=http://localhost:5173             -e HELQIX_API_LISTEN=127.0.0.1:8080 helqix-api:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/health/ready && break; sleep 2; done
          curl -sf http://127.0.0.1:8080/health/live
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v1/projects)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'authorization: Bearer ci-container-key-not-a-secret-0123456789' http://127.0.0.1:8080/v1/projects)" = "200"
      - name: Container logs on failure
        if: failure()
        run: docker logs api || true

  api:
    name: Contracts and staged-build API (K2)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-trixie
        env:
          POSTGRES_USER: helqix
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: helqix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U helqix" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      HELQIX_TEST_DATABASE_URL: postgres://helqix:ci-only-password@127.0.0.1:5432/helqix
    steps:
      - uses: actions/checkout@v4
      - name: Contract tests (serde fixtures, schema files up to date)
        run: cargo test --locked -p helqix-contracts --features schema
      - name: Contract fixtures against JSON Schema (Python)
        run: |
          python3 -m pip install pytest "jsonschema==4.26.0"
          python3 -m pytest -q 15-sdk/platform/contracts/tests_py
      - name: Model-build engine tests
        run: cargo test --locked -p helqix-modelbuild
      - name: API acceptance test against PostgreSQL (must not be skipped)
        run: |
          cargo test --locked -p helqix-api --test builds_api -- --nocapture 2>&1 | tee api-test.log
          ! grep -q SKIPPED api-test.log
      - name: Start the API and run the curl demonstration
        env:
          DATABASE_URL: postgres://helqix:ci-only-password@127.0.0.1:5432/helqix
          HELQIX_API_KEY: ci-only-api-key-0123456789abcdef0123456789
          HELQIX_ALLOWED_ORIGINS: http://localhost:5173
          HELQIX_FRAME_STORE: /tmp/helqix-frames
        run: |
          cargo run -q --locked -p helqix-frames --bin helqix-frames-record -- /tmp/helqix-frames
          cargo build --locked -p helqix-api --bin helqix-api
          ./target/debug/helqix-api > api.log 2>&1 &
          ready=no
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8080/health/ready && { ready=yes; break; }; sleep 1; done
          if [ "$ready" != yes ]; then bash scripts/ci_annotate.sh "API never became ready" api.log 40; exit 1; fi
          bash scripts/k2_curl_demo.sh http://127.0.0.1:8080 > demo.log 2>&1 || {
            bash scripts/ci_annotate.sh "curl demo failed" demo.log 40
            bash scripts/ci_annotate.sh "API log" api.log 25
            exit 1
          }
          cat demo.log
          bash scripts/k4_frames_demo.sh http://127.0.0.1:8080 > frames-demo.log 2>&1 || { bash scripts/ci_annotate.sh "K4 frames demo failed" frames-demo.log 30; bash scripts/ci_annotate.sh "API log" api.log 25; exit 1; }
          cat frames-demo.log
          grep -E "^(frames file|t=)" frames-demo.log | sed 's/^/::notice title=K4 frames demo::/'
      - name: UI engine client against the real API (K8)
        env:
          HELQIX_API_URL: http://127.0.0.1:8080
          HELQIX_API_KEY: ci-only-api-key-0123456789abcdef0123456789
        run: |
          cd 21-app/reality-studio
          npm ci --no-audit --no-fund
          npx vitest run src/test/realApi.test.ts --reporter=verbose 2>&1 | tee ../../ui-real-api.log
          ! grep -q "skipped" ../../ui-real-api.log || { echo "::error title=K8::the real-API UI tests were skipped"; exit 1; }
      - name: Frame benchmark (release, Linux runner)
        run: |
          cargo run -q --release --locked -p helqix-frames --bin helqix-frames-bench | tee bench.log
          grep -E "^ +[0-9]" bench.log | sed 's/^/::notice title=K4 frame benchmark (frames bytes B\/frame encode_ms load_ms getFrame_us runFrames_us)::/'

  ui:
    name: Studio UI (K8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install
        working-directory: 21-app/reality-studio
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: 21-app/reality-studio
        run: npx tsc --noEmit
      - name: Tests (plan rules, bindings, import checks, engine client wire format)
        working-directory: 21-app/reality-studio
        run: npx vitest run
      - name: Build
        working-directory: 21-app/reality-studio
        run: npx vite build

  fmi-adapter:
    name: FMI adapter benchmark (K3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FMPy and Pint (pinned)
        run: python -m pip install "fmpy==0.3.32" "pint==0.26.2"
      - name: Fetch Reference FMUs v0.0.42 (SHA-256 pinned, BSD-2-Clause, Example data)
        run: python -I tools/fixtures/fetch_reference_fmus.py .
      - name: FMI adapter tests (benchmark, units, timeout, invalid input, conformance)
        run: HELQIX_PYTHON="$(which python)" cargo test --locked -p helqix-adapters --features fmi-tests --test fmi

  signing:
    name: Evidence signing, in-toto and cosign (K5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the offline verifier
        run: cargo build --release --locked -p helqix-evidence-verify
      - name: Verify both sample packages and their in-toto attestations with no network at all
        run: |
          for p in sample-package pybamm-adapter-package; do
            sudo unshare --net ./target/release/helqix-evidence-verify "docs/evidence/$p" --trusted-key-file docs/evidence/sample-package.public-key.txt --attestation "docs/evidence/$p.intoto.dsse.json" | tee "verify-$p.log"
            grep -q '^PASS' "verify-$p.log"
          done
      - name: A tampered package fails the offline verifier
        run: |
          cp -r docs/evidence/sample-package /tmp/tampered
          sed -i 's/"NotValidated"/"Validated"/' /tmp/tampered/verdict.json
          if ./target/release/helqix-evidence-verify /tmp/tampered --trusted-key-file docs/evidence/sample-package.public-key.txt --attestation docs/evidence/sample-package.intoto.dsse.json > tampered.log; then echo "UNEXPECTED PASS"; cat tampered.log; exit 1; fi
          grep -E "reason" tampered.log
      - name: Install cosign v3.1.4 (official release, SHA-256 pinned)
        run: |
          curl -sSfL -o /tmp/cosign https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64
          echo "424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa  /tmp/cosign" | sha256sum -c -
          chmod +x /tmp/cosign
      - name: cosign sign, attest and verify offline; tampering refused
        run: |
          for p in sample-package pybamm-adapter-package; do
            bash scripts/cosign_package.sh /tmp/cosign "docs/evidence/$p" "/tmp/cosign-$p" > "cosign-$p.log" 2>&1 || { bash scripts/ci_annotate.sh "cosign $p" "cosign-$p.log" 40; exit 1; }
            tail -1 "cosign-$p.log" | sed 's/^/::notice title=cosign::/'
          done

  assets:
    name: Asset pipeline, glTF validation and renders (K6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Blender 5.2.1 (official build, SHA-256 pinned; GPL, run as a separate program)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libxi6 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1 libxfixes3 libxxf86vm1
          curl -sSfL -o /tmp/blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz
          echo "a31f524fa99a527d3d52b7f5aaa68c34e1a19d5a1c9473f79c5cc610fd5b10e9  /tmp/blender.tar.xz" | sha256sum -c -
          tar -xf /tmp/blender.tar.xz -C /opt
          /opt/blender-5.2.1-linux-x64/blender --version | head -1
      - name: Install KTX-Software 4.4.2 (toktx, Apache-2.0, SHA-256 pinned)
        run: |
          curl -sSfL -o /tmp/ktx.deb https://github.com/KhronosGroup/KTX-Software/releases/download/v4.4.2/KTX-Software-4.4.2-Linux-x86_64.deb
          echo "ca635ed489d8bf54fac8d7687056c651193de0740830a7738cc034adc63e3027  /tmp/ktx.deb" | sha256sum -c -
          sudo apt-get install -y -q /tmp/ktx.deb
          toktx --version
      - name: Asset tools, licence register and JS licence gate
        run: |
          (cd tools/assets && npm ci --no-audit --no-fund)
          python3 -I tools/assets/check_licenses.py examples/assets
          bash scripts/js-license-check.sh tools/assets
          python3 -m pip install -q pytest
          python3 -m pytest -q tools/assets/tests scripts/tests
      - name: Build, optimise (meshopt + KTX2 required), validate and render the Example asset
        run: |
          python3 -I tools/assets/pipeline.py examples/assets/example-bracket --blender /opt/blender-5.2.1-linux-x64/blender --require-ktx2 --hero > pipeline.log 2>&1 || { bash scripts/ci_annotate.sh "asset pipeline" pipeline.log 60; exit 1; }
          report=$(ls .cache/assets/example-bracket/*/report.json)
          python3 -I -c "import json,sys; r=json.load(open(sys.argv[1])); v=r['validation']; print('::notice title=K6 asset::pass', r['pass'], '| glb', r['bytes']['final_glb'], 'B (raw', r['bytes']['raw_glb'], 'B, budget', r['bytes']['budget'], ') | validator errors', v['errors'], 'warnings', v['warnings'], '| textures', v['info']['textures'], '| extensions', v['info']['extensionsUsed'], '| build', r['build']['seconds'], 's, AO bake', r['build']['ao']['bake_seconds'], 's, optimise', r['optimize_seconds'], 's | renders', {k: (x['render_seconds'], x['denoiser'], x['cycles_has_oidn']) for k, x in r['renders'].items()} , '|', r['versions'])" "$report"
          python3 -I tools/assets/pipeline.py examples/assets/example-bracket --blender /opt/blender-5.2.1-linux-x64/blender --require-ktx2 --hero | grep -q '"cached": true'

  calculix-adapter:
    name: CalculiX adapter benchmark (K3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CalculiX ccx from Ubuntu (GPL-2.0, run as a separate program)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q calculix-ccx
          dpkg -s calculix-ccx | grep -E '^(Version|Package)'
      - name: CalculiX adapter tests (beam benchmark, linearity, timeout, invalid input, conformance)
        run: |
          set -o pipefail
          HELQIX_PYTHON="$(which python3)" HELQIX_CCX="$(which ccx)" cargo test --locked -p helqix-adapters --features calculix-tests --test calculix -- --nocapture --test-threads 1 2>&1 | tee calculix.log
          grep BENCHMARK calculix.log | sed 's/^/::notice title=CalculiX benchmark::/'
          dpkg -s calculix-ccx | grep '^Version' | sed 's/^/::notice title=calculix-ccx package::/'

  dev-stack:
    name: Dev stack comes up (K1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL+pgvector, NATS, SeaweedFS, Temporal, OTel collector
        run: |
          cp deploy/dev/.env.example deploy/dev/.env
          dc="docker compose -f deploy/dev/compose.yaml --env-file deploy/dev/.env"
          if ! $dc up -d --wait --wait-timeout 180 > up.log 2>&1; then
            $dc ps -a > ps.log 2>&1; $dc logs --no-color --tail 12 > logs.log 2>&1
            bash scripts/ci_annotate.sh "compose up" up.log 25
            bash scripts/ci_annotate.sh "compose ps" ps.log 15
            bash scripts/ci_annotate.sh "compose logs" logs.log 60
            for s in $($dc ps -a --status exited --services); do $dc logs --no-color --tail 20 "$s" > "exited-$s.log" 2>&1; bash scripts/ci_annotate.sh "exited: $s" "exited-$s.log" 20; done
            exit 1
          fi
          $dc ps
      - name: Probe each service
        run: |
          docker compose -f deploy/dev/compose.yaml --env-file deploy/dev/.env exec -T postgres psql -U helqix -d helqix -c "CREATE EXTENSION IF NOT EXISTS vector; SELECT extversion FROM pg_extension WHERE extname='vector';"
          curl -sf http://127.0.0.1:8222/healthz
          for i in $(seq 1 30); do curl -s -o /dev/null -w "%{http_code}\n" http://127.0.0.1:8333/ | grep -qE "200|403" && break; sleep 2; done
          curl -s -o /dev/null -w "seaweedfs s3 HTTP %{http_code}\n" http://127.0.0.1:8333/
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8233/ && break; sleep 2; done
          curl -sf -o /dev/null -w "temporal ui HTTP %{http_code}\n" http://127.0.0.1:8233/
          curl -s -o /dev/null -w "otlp http HTTP %{http_code}\n" -X POST -H "Content-Type: application/json" -d '{}' http://127.0.0.1:4318/v1/traces
      - name: Stop
        if: always()
        run: docker compose -f deploy/dev/compose.yaml --env-file deploy/dev/.env down -v

  python:
    name: Python suites (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install pytest "pydantic>=2,<3"
      - name: 19-intelligence
        working-directory: 19-intelligence/python
        run: python -m pytest -q tests
      - name: 15-sdk (Python)
        working-directory: 15-sdk/platform/sdk/python
        run: python -m pytest -q tests
      - name: 18-libraries
        working-directory: 18-libraries/python
        run: python -m pytest -q tests

  battery-pybamm:
    name: Battery domain pack and benchmarks (PyBaMM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyBaMM and test dependencies
        run: python -m pip install pytest "pybamm>=26.6,<27"
      - name: PyBaMM version
        run: python -c "import pybamm; print(pybamm.__version__)"
      - name: Battery model, calibration, integrity, pipeline (synthetic data, no network)
        working-directory: 18-libraries/python
        run: python -m pytest -q tests_pybamm
      - name: SPM benchmarks (closed form, convergence, determinism)
        run: python -m pytest -q 23-validation/benchmarks/battery
      - name: PyBaMM solver adapter tests (Phase 6)
        run: HELQIX_PYTHON="$(which python)" cargo test -p helqix-adapters --locked --features pybamm-tests --test pybamm
      - name: Verify the PyBaMM adapter evidence package on Linux (Phase 6)
        run: cargo run -q -p helqix-evidence-verify --locked -- docs/evidence/pybamm-adapter-package --trusted-key-file docs/evidence/sample-package.public-key.txt
