[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helqix-circuit"
version = "0.1.0"
description = "Offline circuit analysis for HELQIX: DC, transient, AC, wires"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["helqix_circuit"]
