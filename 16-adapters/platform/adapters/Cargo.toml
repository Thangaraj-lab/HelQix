[package]
name = "helqix-adapters"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Adapter contracts and registry for the HELQIX platform"
license = "UNLICENSED"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
helqix-core = { path = "../../../01-foundation/crates/helqix-core" }

[features]
# Opt-in tests that need a Python with PyBaMM (run in the CI PyBaMM job).
pybamm-tests = []
# Opt-in FMI tests: need HELQIX_PYTHON with fmpy and pint, and tools/fixtures/fetch_reference_fmus.py run first.
fmi-tests = []
# Opt-in CalculiX tests: need HELQIX_PYTHON and a ccx program (HELQIX_CCX or ccx on PATH).
calculix-tests = []

[[test]]
name = "pybamm"
required-features = ["pybamm-tests"]

[[test]]
name = "fmi"
required-features = ["fmi-tests"]

[[test]]
name = "calculix"
required-features = ["calculix-tests"]
