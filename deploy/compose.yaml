# The whole app in containers: PostgreSQL, the API and the Studio. Not the development stack (deploy/dev).
#   export HELQIX_API_KEY=$(head -c 32 /dev/urandom | base64 | tr -d '=/+' )   # 32+ characters; keep it secret
#   export POSTGRES_PASSWORD=...                                              # keep it secret
#   docker compose -f deploy/compose.yaml up -d --build
# The Studio is then at http://localhost:8080. Add HELQIX_OLLAMA_MODEL to the api environment to describe systems
# (the model server must be reachable from the container; Ollama is loopback-only by design, so run the API on the host for that).
name: helqix

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_USER: helqix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: helqix
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helqix -d helqix"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://helqix:${POSTGRES_PASSWORD}@postgres:5432/helqix
      HELQIX_API_KEY: ${HELQIX_API_KEY:?set HELQIX_API_KEY (32+ characters)}
      HELQIX_ALLOWED_ORIGINS: http://localhost:8080
      HELQIX_API_LISTEN: 0.0.0.0:8080
    volumes: [frames:/data/frames]

  studio:
    build: { context: .., dockerfile: deploy/Dockerfile.studio }
    depends_on: [api]
    environment:
      HELQIX_API_UPSTREAM: api:8080
      HELQIX_API_KEY: ${HELQIX_API_KEY}
    ports: ["8080:8080"]

volumes:
  postgres-data:
  frames:
