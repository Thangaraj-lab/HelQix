<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HELQIX stream viewer (spike)</title>
<style>
  html,body{margin:0;height:100%;background:#111;color:#ddd;font:14px system-ui,sans-serif}
  #v{width:100%;height:100%;object-fit:contain;display:block;touch-action:none}
  #hud{position:fixed;left:8px;bottom:8px;background:#000a;padding:6px 10px;border-radius:6px}
  button{font:inherit;margin-left:8px}
</style>
</head>
<body>
<video id="v" autoplay playsinline muted></video>
<div id="hud"><span id="status">connecting</span> <span id="tag">SPIKE · Example scene · software or NVENC per server</span><button id="measure">Measure latency</button></div>
<script src="/client.js"></script>
</body>
</html>
