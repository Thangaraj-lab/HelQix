[package]
name = "helqix-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Authenticated HTTP API for the HELQIX platform"
license = "UNLICENSED"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "helqix-api"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8.9"
chrono = { version = "0.4", features = ["serde"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
helqix-contracts = { path = "../../15-sdk/platform/contracts" }
helqix-frames = { path = "../../07-time/crates/helqix-frames" }
helqix-modelbuild = { path = "../../03-engineering/crates/helqix-modelbuild" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.7.1", features = ["cors", "limit", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
helqix-freeze = { path = "../../07-time/crates/helqix-freeze" }
